# Baseline kernel/network sysctl hardening (Lynis/CIS-inspired), applied
# via configure_sysctl() in Hardening.sh through /etc/sysctl.d/.
#
# net.ipv4.ip_forward and net.ipv6.conf.all.forwarding are left at 0
# (disabled): if this host is meant to act as a router/NAT gateway, or
# runs Docker/Kubernetes/libvirt (which enable forwarding themselves but
# can be affected by a competing sysctl.d file), remove those two lines
# or set them to 1 before running the script.

# --- Network: anti-spoofing ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# --- Network: reject source-routed packets ---
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# --- Network: ignore ICMP redirects (prevents MITM route injection) ---
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# --- Network: never send ICMP redirects (this host is not a router) ---
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# --- Network: ignore broadcast ICMP (mitigates Smurf-style attacks) ---
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# --- Network: log spoofed/martian packets ---
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# --- Network: SYN flood mitigation ---
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 5

# --- Network: don't act as a router unless deliberately configured to ---
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# --- Network: disable IPv6 router advertisements (no legitimate router here) ---
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# --- Kernel: address space layout randomization ---
kernel.randomize_va_space = 2

# --- Kernel: restrict access to kernel pointers and dmesg ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# --- Kernel: disable the magic SysRq key ---
kernel.sysrq = 0

# --- Kernel: restrict ptrace to a process's own children (Yama LSM) ---
kernel.yama.ptrace_scope = 1

# --- Filesystem: no setuid core dumps, protect hard/symlinks ---
fs.suid_dumpable = 0
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
