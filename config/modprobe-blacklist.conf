# Blacklist of uncommon filesystem and network protocol kernel modules
# (CIS-inspired), applied via configure_module_blacklist() in Hardening.sh.
# These are rarely needed on a server and have a history of kernel
# vulnerabilities; blocking them shrinks the attack surface for local
# privilege escalation via auto-loaded modules.
#
# usb-storage is intentionally NOT listed here: it's already handled by
# disable_usb_storage() via a udev rule, which is more targeted (it blocks
# authorization at the device level instead of removing the module, so
# other usb-storage-adjacent functionality isn't affected).

# Uncommon/legacy filesystems
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install squashfs /bin/false
install udf /bin/false

# Uncommon network protocols
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
